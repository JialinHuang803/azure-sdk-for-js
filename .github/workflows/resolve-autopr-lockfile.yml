name: Resolve AutoPR pnpm-lock Conflicts

on:
  schedule:
    # Run every 6 hours at :15 past the hour to avoid top-of-hour runner contention.
    - cron: '15 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Specific AutoPR number to resolve (leave empty to sweep all eligible conflicting AutoPRs)
        required: false
        type: string
      max_prs:
        description: Maximum number of PRs to process in a sweep (1-20)
        required: false
        default: '10'
        type: string
      dry_run:
        description: Run merge and lockfile regeneration without pushing or commenting
        required: false
        default: false
        type: boolean

# Least-privilege default; individual jobs request only what they need.
permissions: {}

concurrency:
  group: resolve-autopr-lockfile-${{ github.event.inputs.pr_number || 'sweep' }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover conflicting AutoPRs
    if: github.repository == 'Azure/azure-sdk-for-js' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      prs: ${{ steps.find-prs.outputs.prs }}
      has_prs: ${{ steps.find-prs.outputs.has_prs }}
    steps:
      - name: Find eligible conflicting AutoPRs
        id: find-prs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          INPUT_MAX_PRS: ${{ github.event.inputs.max_prs || '10' }}
        with:
          script: |
            const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
            const ALLOWED_AUTHOR = 'JialinHuang803';
            const ALLOWED_BRANCH_PREFIX = 'sdkauto/';
            const ALLOWED_BASE_BRANCH = 'main';

            const isEligibleBase = (pr) => {
              if (pr.state !== 'open') return 'PR is not open';
              if (pr.head?.repo?.full_name !== baseRepo) {
                return `PR is from fork ${pr.head?.repo?.full_name || 'unknown'}`;
              }
              if (pr.base?.ref !== ALLOWED_BASE_BRANCH) {
                return `PR targets ${pr.base?.ref}, not ${ALLOWED_BASE_BRANCH}`;
              }
              if (pr.user?.login !== ALLOWED_AUTHOR) {
                return `PR author is ${pr.user?.login}, not ${ALLOWED_AUTHOR}`;
              }
              if (!pr.head?.ref?.startsWith(ALLOWED_BRANCH_PREFIX)) {
                return `PR branch ${pr.head?.ref} does not start with ${ALLOWED_BRANCH_PREFIX}`;
              }
              return null;
            };

            const getPrWithMergeState = async (pullNumber) => {
              // GitHub computes mergeable_state asynchronously on first read; retry briefly if null.
              for (let attempt = 0; attempt < 3; attempt++) {
                const { data: pr } = await github.rest.pulls.get({
                  ...context.repo,
                  pull_number: pullNumber,
                });
                if (pr.mergeable !== null && pr.mergeable_state !== 'unknown') {
                  return pr;
                }
                await new Promise((resolve) => setTimeout(resolve, 2000));
              }
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: pullNumber,
              });
              return pr;
            };

            const prNumberInput = (process.env.INPUT_PR_NUMBER || '').trim();
            if (prNumberInput) {
              if (!/^\d+$/.test(prNumberInput)) {
                core.setFailed(`Invalid pr_number input: ${prNumberInput}`);
                return;
              }
              const prNumber = parseInt(prNumberInput, 10);
              const pr = await getPrWithMergeState(prNumber);
              const reason = isEligibleBase(pr);
              if (reason) {
                core.warning(`PR #${prNumber} skipped: ${reason}`);
                core.setOutput('prs', '[]');
                core.setOutput('has_prs', 'false');
                return;
              }
              if (pr.mergeable_state !== 'dirty') {
                core.info(`PR #${prNumber} mergeable_state is '${pr.mergeable_state}' (not dirty) — skipping`);
                core.setOutput('prs', '[]');
                core.setOutput('has_prs', 'false');
                return;
              }
              core.info(`Selected PR #${prNumber} (${pr.head.ref})`);
              core.setOutput('prs', JSON.stringify([prNumber]));
              core.setOutput('has_prs', 'true');
              return;
            }

            const parsedMax = parseInt(process.env.INPUT_MAX_PRS || '10', 10);
            const maxPrs = Number.isInteger(parsedMax) ? Math.min(Math.max(parsedMax, 1), 20) : 10;

            const openPrs = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              state: 'open',
              base: ALLOWED_BASE_BRANCH,
              sort: 'updated',
              direction: 'asc',
              per_page: 100,
            });

            const candidates = openPrs.filter((pr) => {
              if (pr.draft) return false;
              if ((pr.title || '').startsWith('Failed-')) return false;
              return isEligibleBase(pr) === null;
            });

            core.info(`Found ${candidates.length} open eligible AutoPR(s); checking merge state (cap: ${maxPrs})`);

            const dirtyPrs = [];
            for (const candidate of candidates) {
              if (dirtyPrs.length >= maxPrs) break;
              const pr = await getPrWithMergeState(candidate.number);
              if (pr.mergeable_state === 'dirty') {
                core.info(`Queueing conflicting AutoPR #${pr.number} (${pr.head.ref})`);
                dirtyPrs.push(pr.number);
              }
            }

            core.info(`Selected ${dirtyPrs.length} conflicting AutoPR(s): ${JSON.stringify(dirtyPrs)}`);
            core.setOutput('prs', JSON.stringify(dirtyPrs));
            core.setOutput('has_prs', dirtyPrs.length > 0 ? 'true' : 'false');

  resolve:
    name: "Resolve lockfile (PR #${{ matrix.pr_number }})"
    needs: discover
    if: needs.discover.outputs.has_prs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pr_number: ${{ fromJson(needs.discover.outputs.prs) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate PR eligibility
        id: validate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ matrix.pr_number }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            });

            const eligible =
              pr.state === 'open' &&
              pr.head?.repo?.full_name === baseRepo &&
              pr.base?.ref === 'main' &&
              pr.user?.login === 'JialinHuang803' &&
              Boolean(pr.head?.ref?.startsWith('sdkauto/'));

            if (!eligible) {
              core.warning(`PR #${prNumber} is no longer eligible — skipping`);
              core.setOutput('eligible', 'false');
              return;
            }

            core.setOutput('eligible', 'true');
            core.setOutput('pr_branch', pr.head.ref);
            core.setOutput('pr_head_sha', pr.head.sha);

      - name: Checkout default branch
        if: steps.validate.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.validate.outputs.eligible == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'

      - name: Get pnpm version from main
        if: steps.validate.outputs.eligible == 'true'
        id: pnpm-version
        run: |
          PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          echo "version=$PNPM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.validate.outputs.eligible == 'true'
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Merge main and resolve pnpm-lock.yaml conflict
        if: steps.validate.outputs.eligible == 'true'
        id: resolve
        env:
          PR_BRANCH: ${{ steps.validate.outputs.pr_branch }}
          PR_HEAD_SHA: ${{ steps.validate.outputs.pr_head_sha }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags origin main "refs/heads/${PR_BRANCH}:refs/remotes/origin/${PR_BRANCH}"
          git checkout -B "$PR_BRANCH" "refs/remotes/origin/${PR_BRANCH}"

          CURRENT_SHA=$(git rev-parse HEAD)
          if [ "$CURRENT_SHA" != "$PR_HEAD_SHA" ]; then
            echo "Branch moved from $PR_HEAD_SHA to $CURRENT_SHA since validation — skipping"
            echo "status=skipped-moved" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff origin/main
          MERGE_EXIT=$?
          set -e

          if [ "$MERGE_EXIT" -eq 0 ]; then
            echo "No merge conflicts detected — aborting uncommitted merge and skipping"
            git merge --abort
            echo "status=skipped-no-conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CONFLICTED_FILES=$(git diff --name-only --diff-filter=U)
          if [ "$CONFLICTED_FILES" != "pnpm-lock.yaml" ]; then
            echo "Conflicts exist outside pnpm-lock.yaml; manual resolution required:"
            echo "$CONFLICTED_FILES"
            git merge --abort
            echo "status=skipped-other-conflicts" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Only pnpm-lock.yaml has merge conflicts; regenerating from main's lockfile"
          git checkout origin/main -- pnpm-lock.yaml

          # Regenerate lockfile only without installing node_modules or running any scripts/hooks.
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts --ignore-pnpmfile

          UNTRACKED_FILES=$(git ls-files --others --exclude-standard)
          if [ -n "$UNTRACKED_FILES" ]; then
            echo "::error::Unexpected untracked files created during lockfile regeneration:"
            echo "$UNTRACKED_FILES"
            git merge --abort
            exit 1
          fi

          UNSTAGED_FILES=$(git diff --name-only)
          if [ -n "$UNSTAGED_FILES" ] && [ "$UNSTAGED_FILES" != "pnpm-lock.yaml" ]; then
            echo "::error::Unexpected files modified during lockfile regeneration:"
            echo "$UNSTAGED_FILES"
            git merge --abort
            exit 1
          fi

          if grep -qE '^(<<<<<<<|=======|>>>>>>>)' pnpm-lock.yaml; then
            echo "::error::Conflict markers remain in pnpm-lock.yaml"
            git merge --abort
            exit 1
          fi

          git add pnpm-lock.yaml
          git commit -m "Merge branch 'main' into ${PR_BRANCH} and resolve pnpm-lock.yaml conflict"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled — skipping push"
            echo "status=dry-run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push origin "HEAD:refs/heads/${PR_BRANCH}"
          echo "status=resolved" >> "$GITHUB_OUTPUT"

      - name: Post result comment
        if: steps.resolve.outputs.status == 'resolved'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ matrix.pr_number }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body: '✅ Automatically merged `main` and resolved the `pnpm-lock.yaml` merge conflict.',
            });
